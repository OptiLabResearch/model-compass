name: Weekly data refresh

concurrency:
  group: weekly-data-refresh
  cancel-in-progress: false

on:
  schedule:
    # Sundays at 19:00 UTC — matches the previous local cron cadence.
    - cron: "0 19 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pin to full commit SHAs (immutable). Tag refs like @v4 are mutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Data pipeline: build the rich private dataset, then derive the public
      # site models.json + benchmarks.json from it.
      #
      # The rich RSC leaderboard pipeline is the active site source. The
      # optional API and snapshot provide baseline validation and cross-checks;
      # the retained Free-API/page-scrape script is not part of this workflow.
      - name: Build private AA dataset (RSC + API + snapshot)
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python3 -m scripts.aa.orchestrate

      - name: Set refresh date
        id: refresh_date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build public site models.json from rich dataset
        run: python3 scripts/build_site_from_aa.py --as-of "${{ steps.refresh_date.outputs.date }}"

      - name: Export dated history CSV
        run: python3 scripts/export_history_csv.py --date "${{ steps.refresh_date.outputs.date }}"

      - name: Export static benchmarks JSON
        run: python3 scripts/export_benchmarks_json.py

      - name: Refresh provider observations (OpenRouter public API)
        run: python3 scripts/aa/openrouter_source.py --max-endpoints 25

      - name: Refresh Gate-D Endpoint Accuracy evidence
        run: python3 -m scripts.aa.endpoint_accuracy gpt-oss-120b

      - name: Refresh coding-agent observations (public AA page)
        run: python3 -m scripts.aa.coding_agent_source

      - name: Build and validate Phase 3 derived artifacts
        run: python3 -m scripts.aa.phase3_artifacts

      - name: Validate generated refresh
        run: python3 scripts/check.py --scope all

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/models.json public/data/benchmarks.json \
            data/enrichment_cache.json data/history/ \
            data/aa_models_v2.json data/aa_pipeline_report.json \
            data/openrouter_observations.json data/coding_agent_observations.json \
            data/openrouter_sampling_state.json data/endpoint_accuracy_observations.json \
            data/identity_mappings.json data/phase3_summary.json
          git diff --staged --quiet || git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
          git push

      # The 2026-07-11 refresh failed silently and went unnoticed for a week.
      # Make a broken refresh impossible to miss.
      - name: Open an issue if the refresh failed
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = [
              'The scheduled data refresh failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Likely causes: `AA_API_KEY` missing or expired, a featured slug renamed',
              'upstream, an RSC leaderboard payload change, or a stale third-party',
              'snapshot. The pipeline is designed to fail visibly rather than publish',
              'empty data — inspect the raw cache and pipeline report.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'data-refresh',
            });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Weekly data refresh failed', body, labels: ['data-refresh'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            }
