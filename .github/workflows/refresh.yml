name: Weekly data refresh

concurrency:
  group: weekly-data-refresh
  cancel-in-progress: false

on:
  schedule:
    # Sundays at 19:00 UTC — matches the previous local cron cadence.
    - cron: "0 19 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pin to full commit SHAs (immutable). Tag refs like @v4 are mutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Fails the job if the AA API is unreachable or a featured model has
      # vanished upstream, rather than committing a silently-degraded dataset.
      - name: Fetch model data from Artificial Analysis
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python3 scripts/fetch_aa_models.py

      # Private model-selection pipeline (adapter architecture): merges the
      # rich RSC leaderboard payload + official API + Oolong snapshot into
      # data/aa_models_v2.json. AA_API_KEY is passed through so the official
      # API validates the RSC data; the RSC and snapshot sources need no key.
      - name: Build private AA dataset (RSC + API + snapshot)
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python3 -m scripts.aa.orchestrate

      - name: Export dated history CSV
        run: python3 scripts/export_history_csv.py

      - name: Export static benchmarks JSON
        run: python3 scripts/export_benchmarks_json.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/models.json public/data/benchmarks.json \
            data/enrichment_cache.json data/history/ \
            data/aa_models_v2.json data/aa_pipeline_report.json
          git diff --staged --quiet || git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
          git push

      # The 2026-07-11 refresh failed silently and went unnoticed for a week.
      # Make a broken refresh impossible to miss.
      - name: Open an issue if the refresh failed
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = [
              'The scheduled data refresh failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Likely causes: `AA_API_KEY` missing or expired, a featured slug renamed',
              'upstream, AA changed the /models page (legacy pipeline), or the RSC',
              'leaderboard payload structure changed (scripts/aa/orchestrate.py is',
              'designed to fail visibly rather than publish empty data — see the',
              'pipeline report).',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'data-refresh',
            });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Weekly data refresh failed', body, labels: ['data-refresh'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            }
