name: Bug report
description: Report a reproducible problem with Model Compass
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Model Compass. Do not report security vulnerabilities here; follow SECURITY.md instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Select…
        3. See…
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or links if useful. Remove personal or secret information first.
